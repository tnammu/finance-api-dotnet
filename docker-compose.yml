services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-api-backend
    ports:
      - "5000:5000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/dividends.db;Cache=Shared;Mode=ReadWriteCreate
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-api-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

volumes:
  sqlite-data:

networks:
  app-network:
    driver: bridge
